name: Collect prices

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect-prices.mjs
      - name: Commit history
        run: |
          git config user.name "glcr-bot"
          git config user.email "glcr-bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "Update price history" && git pull --rebase && git push)};
