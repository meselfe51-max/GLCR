name: Collect prices

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect prices
        run: node scripts/collect-prices.mjs

      - name: Commit history
        run: |
          if [ ! -f data/history.json ]; then
            echo "No history file, nothing to commit."
            exit 0
          fi
          git config user.name "glcr-bot"
          git config user.email "glcr-bot@users.noreply.github.com"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update price history"
          git pull --rebase
          git push
